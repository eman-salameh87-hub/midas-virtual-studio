name: Mirror to Railway repo

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Mirror Repo
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git push --force https://eman-salameh87-hub:${TOKEN}@github.com/eman-salameh87-hub/midas-virtual-studio.git HEAD:main